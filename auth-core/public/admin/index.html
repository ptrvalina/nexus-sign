<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXUS-SIGN — Admin</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --border: #262b34;
    --text: #e6e8eb;
    --text-dim: #9aa2ad;
    --accent: #4f8cff;
    --danger: #e5534b;
    --warn: #d4a72c;
    --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  header .who { color: var(--text-dim); font-size: 13px; }
  header button { background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  header button:hover { color: var(--text); border-color: var(--text-dim); }

  main { max-width: 1100px; margin: 0 auto; padding: 24px; display: none; }
  main.visible { display: block; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .stat-card .label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .stat-card .rows div { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }

  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
  section > .section-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  section > .section-header h2 { font-size: 13px; font-weight: 600; margin: 0; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); }
  section .body { padding: 12px 16px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select { background: #0c0e12; border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  input::placeholder { color: var(--text-dim); }
  button.primary { background: var(--accent); color: white; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.primary:hover { opacity: 0.9; }
  button.ghost { background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  button.ghost:hover { color: var(--text); border-color: var(--text-dim); }
  button.danger { background: none; border: 1px solid var(--danger); color: var(--danger); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  button.danger:hover { background: var(--danger); color: white; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-dim); font-weight: 500; padding: 8px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; }
  .muted { color: var(--text-dim); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.ACTIVE, .badge.VERIFIED, .badge.DELIVERED { background: rgba(63,185,80,0.15); color: var(--ok); }
  .badge.SUSPENDED, .badge.PENDING, .badge.REACTIVATE { background: rgba(212,167,44,0.15); color: var(--warn); }
  .badge.REVOKED, .badge.REVOKE, .badge.FAILED, .badge.EXPIRED { background: rgba(229,83,75,0.15); color: var(--danger); }

  #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
  .login-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 32px; width: 320px; }
  .login-box h1 { font-size: 16px; margin: 0 0 4px; }
  .login-box p { color: var(--text-dim); font-size: 13px; margin: 0 0 20px; }
  .login-box label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; margin-top: 12px; }
  .login-box input { width: 100%; }
  .login-box button { width: 100%; margin-top: 20px; padding: 9px; }
  .error-text { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }

  .identity-lookup { display: flex; gap: 8px; margin-bottom: 12px; }
  .identity-result { display: none; }
  .identity-result.visible { display: block; }
  .identity-actions { display: flex; gap: 8px; margin-top: 12px; }
  .empty-state { color: var(--text-dim); padding: 16px 0; text-align: center; font-size: 13px; }
</style>
</head>
<body>

<div id="login-screen">
  <form class="login-box" id="login-form">
    <h1>NEXUS-SIGN</h1>
    <p>Admin Dashboard</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <label for="totp">One-time code</label>
    <input id="totp" name="totp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" />
    <button class="primary" type="submit">Sign in</button>
    <div class="error-text" id="login-error"></div>
  </form>
</div>

<header id="app-header" style="display:none;">
  <h1>NEXUS-SIGN — Admin</h1>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="who" id="who"></span>
    <button id="logout-btn">Sign out</button>
  </div>
</header>

<main id="app-main">
  <div class="stats" id="stats"></div>

  <section>
    <div class="section-header"><h2>Identity lookup</h2></div>
    <div class="body">
      <div class="identity-lookup">
        <input id="identity-search-input" placeholder="9-digit nexus_id" maxlength="9" />
        <button class="primary" id="identity-search-btn">Look up</button>
      </div>
      <div id="identity-result" class="identity-result"></div>
    </div>
  </section>

  <section>
    <div class="section-header">
      <h2>Pending approvals</h2>
      <button class="ghost" id="approvals-refresh-btn">Refresh</button>
    </div>
    <div class="body"><div id="approvals-table"></div></div>
  </section>

  <section>
    <div class="section-header"><h2>Bank clients</h2></div>
    <div class="body"><div id="clients-table"></div></div>
  </section>

  <section>
    <div class="section-header">
      <h2>Audit log</h2>
      <div class="filters">
        <input id="audit-nexus-filter" placeholder="nexus_id" maxlength="9" />
        <input id="audit-event-filter" placeholder="event_type" />
        <button class="ghost" id="audit-filter-btn">Filter</button>
      </div>
    </div>
    <div class="body"><div id="audit-table"></div></div>
  </section>

  <section>
    <div class="section-header">
      <h2>Webhook deliveries</h2>
      <div class="filters">
        <select id="webhook-status-filter">
          <option value="">All statuses</option>
          <option value="PENDING">Pending</option>
          <option value="DELIVERED">Delivered</option>
          <option value="FAILED">Failed</option>
        </select>
        <button class="ghost" id="webhook-filter-btn">Filter</button>
      </div>
    </div>
    <div class="body"><div id="webhook-table"></div></div>
  </section>
</main>

<script src="/admin/admin.js"></script>
</body>
</html>
