title = "NEXUS-SIGN secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Published protocol test vectors and attestation fixtures (fixed public test material chosen for reproducibility), configuration templates without values, and PKCS#11 constant names; not secrets"
paths = [
  '''^auth-core/test-vectors/(signed-payload-v1|device-protocols-v1|secure-push-v1|recovery-v2)\.json$''',
  '''^ios-sdk/Tests/NEXUSSignTests/Resources/(signed-payload-v1|device-protocols-v1|secure-push-v1|recovery-v2)\.json$''',
  '''^auth-core/test/fixtures/android-key-attestation/[^/]+\.json$''',
  '''(^|/)\.env\.example$''',
]
regexes = [
  '''^Pkcs11js\.CK[A-Z]_[A-Z0-9_]+$''',
]
