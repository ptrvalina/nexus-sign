apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-auth-core
  labels: { app.kubernetes.io/name: nexus-auth-core, app.kubernetes.io/component: api, app.kubernetes.io/part-of: nexus-sign }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: nexus-auth-core, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexus-auth-core, app.kubernetes.io/component: api }
    spec:
      serviceAccountName: nexus-auth-core
      automountServiceAccountToken: false
      # SIGTERM stops the workers and drains the HSM worker (src/server.ts).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: nexus-auth-core, app.kubernetes.io/component: api } }
      containers:
        - name: auth-core
          image: registry.bank.example/nexus-sign/auth-core:2.0.0-rc.2 # CHANGE: pin by digest
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          envFrom:
            - configMapRef: { name: nexus-auth-core-config }
            - secretRef: { name: nexus-auth-core-secrets }
          # /healthz: the process runs. /readyz: PostgreSQL, Redis and the HSM answer.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: attestation-status, mountPath: /var/run/nexus/attestation-status, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        # Refreshed by the bank's job (docs/operations/runbooks/android-attestation-status-list.md).
        - name: attestation-status
          configMap: { name: nexus-android-attestation-status, optional: false }
