# NOT APPLIED AS IS. The keys Auth Core reads from a Secret, without values.
# Create the Secret from the bank's secrets manager (for example with the
# External Secrets Operator); never commit values. The wrapped master keys
# are produced by `node dist/cli/masterKeys.js generate <webhook|device|admin>`
# against the bank's HSM (docs/operations/configuration.md#master-keys).
apiVersion: v1
kind: Secret
metadata:
  name: nexus-auth-core-secrets
  labels: { app.kubernetes.io/name: nexus-auth-core, app.kubernetes.io/part-of: nexus-sign }
type: Opaque
stringData:
  DATABASE_URL: ""                       # postgres://nexus_app:...@db.bank.internal:5432/nexus?sslmode=verify-full
  REDIS_URL: ""                          # rediss://...
  PKCS11_PIN: ""
  METRICS_BEARER_TOKEN: ""               # at least 32 characters
  WEBHOOK_SECRET_ENCRYPTION_KEY_WRAPPED: ""
  ADMIN_SECRET_ENCRYPTION_KEY_WRAPPED: ""
  DEVICE_SECRET_ENCRYPTION_KEY_WRAPPED: ""
  APPLE_APP_ATTEST_ROOT_CA_PEM: ""       # Apple App Attestation Root CA, pinned
  GOOGLE_SERVICE_ACCOUNT_JSON: ""        # Play Integrity decoding
---
# The migration Job connects as the owner role (scripts/db/roles.sql).
apiVersion: v1
kind: Secret
metadata:
  name: nexus-auth-core-migrate
  labels: { app.kubernetes.io/name: nexus-auth-core, app.kubernetes.io/part-of: nexus-sign }
type: Opaque
stringData:
  DATABASE_URL: ""                       # postgres://nexus_owner:...
