# TEMPORARY (cycle 4): the lockfile cannot be regenerated in the engineering
# sandbox (no registry access). This job resolves the two security updates
# (zod ^4.6.7 for GHSA-mrhx-c7xc-m3w5, body-parser 1.20.9 for GHSA-27r3-jxmh-p828)
# and prints the resulting files to the log. Removed in the commit that applies them.
name: lockfile refresh (temporary)
on:
  pull_request:
    paths: ['.github/workflows/lockfile-refresh.yml']
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: auth-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm --version
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund zod@^4.6.7
      - run: npm update --package-lock-only --ignore-scripts --no-audit --no-fund body-parser
      - run: git diff --stat
      - run: npm audit --audit-level=high --omit=dev
      - name: Print package.json and package-lock.json (gzip, base64)
        run: |
          echo "BEGIN-PKG"; gzip -9c package.json | base64 -w 900; echo "END-PKG"
          echo "BEGIN-LOCK"; gzip -9c package-lock.json | base64 -w 900; echo "END-LOCK"
          sha256sum package.json package-lock.json
