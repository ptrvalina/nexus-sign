name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auth-core:
    name: auth-core / build and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: auth-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lockfile is committed
        run: |
          test -f package-lock.json || { echo "::error file=auth-core/package.json::package-lock.json is missing; dependencies must be installed from a reviewed lockfile (npm ci)"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: auth-core/package-lock.json
      - name: Install dependencies exactly as locked
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests, protocol vectors, OpenAPI routes, repository hygiene
        run: npm run check:all
      - name: OpenAPI contract parses
        run: |
          python3 -c "import yaml; d = yaml.safe_load(open('openapi.yaml')); assert d['openapi'] == '3.0.3' and d['paths'], 'invalid OpenAPI document'"

  auth-core-integration:
    name: auth-core / integration (PostgreSQL, Redis, SoftHSM)
    runs-on: ubuntu-24.04
    needs: auth-core
    defaults:
      run:
        working-directory: auth-core
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      INTEGRATION_REDIS_URL: redis://localhost:6379
      SOFTHSM2_MODULE: /usr/lib/softhsm/libsofthsm2.so
      SOFTHSM2_UTIL: /usr/bin/softhsm2-util
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: SoftHSM (PKCS#11 adapter tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q softhsm2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth-core/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the native PKCS#11 binding
        run: npm rebuild pkcs11js
      - run: npm run build
      - name: Integration suites (concurrency, tenant isolation, replay, HSM, evidence, recovery, admin, mTLS)
        run: npm run test:integration

  auth-core-e2e:
    name: auth-core / end-to-end (PostgreSQL, Redis)
    runs-on: ubuntu-24.04
    needs: auth-core
    defaults:
      run:
        working-directory: auth-core
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_sign
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: development
      # Software HSM and attestation off are development settings.
      ALLOW_INSECURE_DEVELOPMENT: 'true'
      PGOPTIONS: -c client_min_messages=warning
      DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus_sign
      REDIS_URL: redis://localhost:6379
      HSM_ADAPTER: software
      REQUIRE_VALID_ATTESTATION: 'false'
      OFFLINE_CONFIRMATION_ENABLED: 'true'
      PORT: '8080'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Generate throwaway encryption keys for this run
        run: echo "DEVICE_SECRET_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth-core/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build

      - name: Apply schema to a fresh database (twice, it must be idempotent)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f src/db/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f src/db/schema.sql

      - name: Apply upgrade migrations on top of the schema
        run: for f in migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done

      - name: Database roles (the service runs as nexus_app, which owns nothing)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f scripts/db/roles.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "ALTER ROLE nexus_app WITH LOGIN PASSWORD 'nexus-app-ci'"
          echo "DATABASE_URL=postgres://nexus_app:nexus-app-ci@localhost:5432/nexus_sign" >> "$GITHUB_ENV"

      - name: Register a test bank client
        id: creds
        run: |
          OUTPUT=$(node dist/cli/registerClient.js e2e-bank)
          SECRET=$(echo "$OUTPUT" | awk '/client_secret:/ {print $2}')
          test -n "$SECRET"
          echo "::add-mask::$SECRET"
          echo "client_secret=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Start Auth Core
        run: |
          nohup npm run start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/readyz && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: End-to-end flow
        run: node scripts/e2e-smoke.mjs http://localhost:8080
        env:
          NEXUS_SIGN_SMOKE_CLIENT_ID: e2e-bank
          NEXUS_SIGN_SMOKE_CLIENT_SECRET: ${{ steps.creds.outputs.client_secret }}

      - name: Server log
        if: always()
        run: cat server.log || true

  container-images:
    name: containers / build and health check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Auth Core image
        run: docker build -t nexus-sign/auth-core:ci auth-core
      - name: Sandbox image
        run: |
          docker build -t nexus-sign/sandbox:ci sandbox
          docker run -d --name sbx -e HOST=0.0.0.0 -e SANDBOX_ACCESS_CODES="ci:$(openssl rand -hex 16)" -p 8787:8787 nexus-sign/sandbox:ci
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8787/api/v1/health && exit 0; sleep 1; done
          docker logs sbx; exit 1

  ios-sdk:
    name: ios-sdk / build and unit tests
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios-sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Swift package build and tests
        run: swift test

  android-sdk:
    name: android-sdk / build and unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4, also validates the wrapper checksum
      - name: Unit tests and release build
        run: sh ./gradlew --no-daemon testDebugUnitTest assembleRelease

  sandbox:
    name: sandbox / protocol and API tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'  # oldest supported version
      - name: Unit and API tests (standard library only)
        run: python -m unittest discover -s tests -v
