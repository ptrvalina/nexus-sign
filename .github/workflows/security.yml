name: Security

# Static analysis, dependency audit, secret scan, dependency and image
# scanning, and a CycloneDX SBOM of the Auth Core dependency tree. Third-party actions are pinned to commit SHAs
# (resolved from the release tags named in the comments); review the pins
# when updating them.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-24.04
    # Results are kept as a SARIF artifact rather than uploaded to code
    # scanning, which a private repository can use only with GitHub Code
    # Security. The job fails on any high or critical result.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
      - name: Fail on high or critical results
        run: |
          jq -r '.runs[]
            | ((.tool.driver.rules // []) + [.tool.extensions[]?.rules[]?]) as $rules
            | ($rules | map({(.id): (.properties["security-severity"] // "0")}) | add // {}) as $severity
            | .results[]?
            | "\($severity[.ruleId] // "0")\t\(.ruleId)\t\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)\t\(.message.text | split("\n")[0])"' \
            codeql-results/*.sarif | sort -rn > findings.tsv
          echo "CodeQL results (security severity, rule, location, message):"
          cat findings.tsv
          high=$(awk -F'\t' '$1 >= 7.0' findings.tsv | wc -l)
          echo "high or critical: $high"
          test "$high" -eq 0

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: auth-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: CycloneDX SBOM of the production dependencies
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file auth-core.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: auth-core/auth-core.cdx.json

  trivy:
    name: Trivy (dependencies and container image)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Filesystem scan (lockfiles, high/critical, fixed versions available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build the Auth Core image
        run: docker build -t nexus-sign/auth-core:scan auth-core
      - name: Image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexus-sign/auth-core:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  audit:
    name: Dependency audit and secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Dependency audit (production, high/critical)
        working-directory: auth-core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1
