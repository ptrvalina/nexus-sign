name: Security

# Static analysis, dependency audit, secret scan, dependency and image
# scanning, and a CycloneDX SBOM of the Auth Core dependency tree. Third-party actions are pinned to commit SHAs
# (resolved from the release tags named in the comments); review the pins
# when updating them.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-24.04
    # Results are kept as a SARIF artifact rather than uploaded to code
    # scanning, which a private repository can use only with GitHub Code
    # Security. The gate fails on any result of security severity 7.0 or
    # higher that is not listed in .github/codeql/reviewed-findings.tsv.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
      - name: Gate on high and critical results
        run: node .github/codeql/gate.mjs codeql-results

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: auth-core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: CycloneDX SBOM of the production dependencies
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file auth-core.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: auth-core/auth-core.cdx.json

  trivy:
    name: Trivy (dependencies and container image)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Filesystem scan (lockfiles, high/critical, fixed versions available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build the Auth Core image
        run: docker build -t nexus-sign/auth-core:scan auth-core
      - name: Image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexus-sign/auth-core:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  audit:
    name: Dependency audit and secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Dependency audit (production, high/critical)
        working-directory: auth-core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  webrtc-binaries:
    name: WebRTC binaries (checksums, signature, licence files)
    # Evidence for the pinned libwebrtc binaries of the optional call modules
    # (finding D-14, THIRD_PARTY_MEDIA.md TPM-2/TPM-3). Fails on a checksum
    # mismatch or an invalid signature; whether to trust the publishers stays
    # the owner's decision (DECISION_LOG.md D-015).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Download, hash and verify the pinned binaries
        run: .github/media/check-webrtc-binaries.sh webrtc-binaries
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: webrtc-binaries-report
          path: |
            webrtc-binaries/report.txt
            webrtc-binaries/verify.txt
            webrtc-binaries/ios-Package.swift
            webrtc-binaries/android.pom
