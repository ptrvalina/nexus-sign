name: Release

# Builds the Auth Core image for a version tag, records its SBOM and a SLSA
# build provenance attestation signed through GitHub's OIDC identity
# (verifiable with `gh attestation verify`).

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  auth-core-image:
    name: Auth Core image, SBOM and provenance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Tag matches VERSION
        run: |
          test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)" || { echo "tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release builds only a commit whose CI and security workflows completed successfully.
          for workflow in ci.yml security.yml; do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=1" --jq '.workflow_runs[0].conclusion // "none"')
            test "$conclusion" = "success" || { echo "${workflow} for ${GITHUB_SHA}: ${conclusion}"; exit 1; }
          done
      - name: Lockfile is committed
        run: test -f auth-core/package-lock.json
      - name: Build image archive
        run: |
          docker build -t "nexus-sign/auth-core:${GITHUB_REF_NAME}" auth-core
          docker save "nexus-sign/auth-core:${GITHUB_REF_NAME}" | gzip -n > "auth-core-${GITHUB_REF_NAME}.tar.gz"
          sha256sum "auth-core-${GITHUB_REF_NAME}.tar.gz" > "auth-core-${GITHUB_REF_NAME}.tar.gz.sha256"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # No dependency cache in release builds, also if package.json ever
          # gets a packageManager field (setup-node v5 would then cache).
          package-manager-cache: false
      - name: SBOM
        working-directory: auth-core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file "../auth-core-${GITHUB_REF_NAME}.cdx.json"
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: auth-core-${{ github.ref_name }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-core-${{ github.ref_name }}
          path: |
            auth-core-${{ github.ref_name }}.tar.gz
            auth-core-${{ github.ref_name }}.tar.gz.sha256
            auth-core-${{ github.ref_name }}.cdx.json
