name: Change request
description: A new capability or a change to existing behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the bank, integrator or operator cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: checkboxes
    id: impact
    attributes:
      label: Affects
      options:
        - label: The signed authorization protocol or device protocols
        - label: Evidence format
        - label: Public API or SDK API
        - label: Database schema
