# Hosted sandbox: the application behind Caddy, which obtains and renews the
# HTTPS certificate automatically. Configure deploy/.env first (see .env.example).
#
#   cd sandbox/deploy
#   docker compose up -d --build
services:
  sandbox:
    build: ..
    restart: unless-stopped
    environment:
      SANDBOX_ACCESS_CODES: ${SANDBOX_ACCESS_CODES:?set SANDBOX_ACCESS_CODES in deploy/.env}
      SANDBOX_SESSION_SECRET: ${SANDBOX_SESSION_SECRET:?set SANDBOX_SESSION_SECRET in deploy/.env}
      SANDBOX_TRUST_PROXY: '1'
    expose:
      - '8787'
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [sandbox]
    environment:
      SANDBOX_DOMAIN: ${SANDBOX_DOMAIN:?set SANDBOX_DOMAIN in deploy/.env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
